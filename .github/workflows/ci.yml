name: CI

# A fresh checkout is the point: the build broke once because git cannot track
# an empty directory, and nothing on a developer's machine reproduces that.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Pinned rather than ubuntu-latest, which is mid-migration to Ubuntu 26:
    # the runner image should move when someone chooses to move it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12"

      - name: Enable pnpm
        # Node bundles a corepack that hard-codes npm's signing keys, and npm
        # has rotated them since 22.12 shipped, so the bundled one cannot verify
        # the pnpm download. --force is needed because its shim already owns the
        # path. The pnpm version itself stays pinned in package.json.
        run: |
          npm install -g --force corepack@latest
          corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm check

      - name: Unit tests
        run: pnpm test:unit

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and end-to-end tests
        # PUBLIC_ANALYTICS stays unset: the suite asserts the tag is absent.
        run: pnpm test:e2e

      - name: Assert publishable artifacts
        # The same gate publish.sh runs, so CI fails before a human would.
        run: node scripts/assert-publishable.mjs dist tests/fixtures/historical-urls.txt
